name: Java CI

on: [push]

jobs:
  checkstyle:
    runs-on: ubuntu-latest # На какой ОС запускать
    steps:
      - uses: actions/checkout@v4 # Склонировать твой код
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Grant execute for gradlew
        run: chmod +x ./gradlew
      - name: Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest
  build: # Название джобы (работы)
    runs-on: ubuntu-latest # На какой ОС запускать
    steps:
      - uses: actions/checkout@v4 # Склонировать твой код
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Build with Gradle
        run: ./gradlew build # Запустить сборку